name: Materialize release source

on:
  push:
    branches: [ main ]
    paths:
      - 'releases/16.0.1/**'
      - '.github/workflows/materialize-release-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand vetted source archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/tffax-release
          mkdir -p /tmp/tffax-release
          unzip -q releases/16.0.1/tffax-16.0.1-src.zip -d /tmp/tffax-release
          test -f /tmp/tffax-release/tffax/module.xml
          test -f /tmp/tffax-release/tffax/Tffax.class.php
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'releases' \
            --exclude 'dist' \
            /tmp/tffax-release/tffax/ ./

      - name: PHP syntax validation
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize TechFinity Fax 16.0.1 source'
          git push origin HEAD:main
